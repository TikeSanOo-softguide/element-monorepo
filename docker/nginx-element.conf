server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /app;
    index index.html;

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /i18n/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js|wasm|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
}
