# Host nginx site for https://chat-app.burmalearn.site
# Place under /etc/nginx/sites-available/ and enable with certbot (or keep existing SSL blocks).
#
# IMPORTANT:
# - Keep your existing /_matrix (and .well-known) locations pointing at Synapse :8008
# - Change the Element upstream from webpack-dev-server to the prod container on 127.0.0.1:8080
# - Do NOT proxy /ws to webpack anymore

server {
    listen 80;
    listen [::]:80;
    server_name chat-app.burmalearn.site;

    # Certbot will redirect HTTP→HTTPS; keep ACME if already present
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat-app.burmalearn.site;

    # --- certbot managed paths (adjust if different on your VPS) ---
    ssl_certificate     /etc/letsencrypt/live/chat-app.burmalearn.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-app.burmalearn.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Client well-known (optional if Synapse serves it)
    location = /.well-known/matrix/client {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/matrix/server {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Matrix Client-Server / Federation via Synapse
    location /_matrix {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 50M;
    }

    location /_synapse {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Element Web — PRODUCTION static container (NOT webpack-dev-server)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
