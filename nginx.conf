server {
    listen       ${ELEMENT_WEB_PORT};
    listen       [::]:${ELEMENT_WEB_PORT};
    server_name  _;

    root   /app;
    index  index.html;

    # SPA routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache bootstrap files so deployments roll out immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /i18n/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Runtime config is materialized under /tmp at container start
    location = /config.json {
        alias /tmp/element-web-config/config.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/config\.[^/]+\.json$ {
        alias /tmp/element-web-config;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Optional runtime modules volume
    location /modules/ {
        alias /modules/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long-lived hashed bundles
    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js|wasm|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
