services:
  element-web:
    build:
      context: .
      dockerfile: Dockerfile
      # On Linux servers, set DOCKER_BUILD_NETWORK=host if apt-get cannot
      # reach Debian mirrors through Docker's default bridge DNS.
      network: ${DOCKER_BUILD_NETWORK:-default}
    ports:
      - "8080:8080"
    volumes:
      - ./:/project
      - js_sdk_node_modules:/project/matrix-js-sdk/node_modules
      - web_node_modules:/project/element-web/node_modules
      - app_node_modules:/project/element-web/apps/web/node_modules
    environment:
      - PORT=8080
      - SKIP_INSTALL=0
      - NX_SKIP_NX_CACHE=true
      - NX_DAEMON=false
    stdin_open: true
    tty: true

volumes:
  js_sdk_node_modules:
  web_node_modules:
  app_node_modules: